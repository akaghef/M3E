name: Build & Test

on:
  push:
    branches:
      - dev-beta
      - main
    paths:
      - beta/**
      - final/**
      - docs/semantic/**
      - .github/workflows/test.yml
      - scripts/ops/preflight.*
      - scripts/ops/ci-checks.json
  pull_request:
    branches:
      - dev-beta
      - main
    paths:
      - beta/**
      - final/**
      - docs/semantic/**
      - .github/workflows/test.yml
      - scripts/ops/preflight.*
      - scripts/ops/ci-checks.json

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    name: Beta build and test
    runs-on: ubuntu-latest

    # The record store's database. Unit tests make stores of their own names in it.
    services:
      neo4j:
        image: neo4j:2026.10.2-community
        env:
          NEO4J_AUTH: none
        ports:
          - 7688:7687
        options: >-
          --health-cmd "cypher-shell -a bolt://localhost:7687 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30

    env:
      M3E_TEST_NEO4J_BOLT: bolt://127.0.0.1:7688

    defaults:
      run:
        working-directory: beta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            beta/package-lock.json
            final/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Agent icon validation dependency
        run: python3 -m pip install Pillow

      - name: Typecheck
        run: bash ../scripts/ops/preflight.sh --check typecheck

      - name: Check dependency boundaries
        run: bash ../scripts/ops/preflight.sh --check lint-deps

      - name: Check source copy drift
        run: bash ../scripts/ops/preflight.sh --check lint-copy

      # Build node + browser artifacts first. Some unit tests load built browser
      # bundles (dist/browser/*.js); `npm test` only runs build:node, so a clean
      # checkout would be missing them. `npm run build` covers node + browser.
      - name: Build
        run: bash ../scripts/ops/preflight.sh --check build

      - name: Validate repository-local semantic source specimen
        run: bash ../scripts/ops/preflight.sh --check semantic-source

      - name: Run tests
        run: bash ../scripts/ops/preflight.sh --check test

  final:
    name: Final build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: final

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            beta/package-lock.json
            final/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

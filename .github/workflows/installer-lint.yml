name: Installer & Script Lint

on:
  push:
    paths:
      - "install/**"
      - "scripts/**"
      - ".gitattributes"
      - ".github/workflows/installer-lint.yml"
  pull_request:
    paths:
      - "install/**"
      - "scripts/**"
      - ".gitattributes"
      - ".github/workflows/installer-lint.yml"

jobs:
  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer checks
        run: bash scripts/ops/preflight.sh --check installer-lint

      - name: Install shellcheck if unavailable
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi

      - name: Shell scripts pass shellcheck
        run: bash scripts/ops/preflight.sh --check shellcheck

name: Personal Path Check
on: [push, pull_request]
jobs:
  personal-path-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject retired personal identifier in tracked files
        shell: bash
        run: bash scripts/ops/check-personal-path.sh
      - name: Reject file names Git for Windows cannot check out
        shell: bash
        run: node scripts/ops/check-windows-filenames.mjs

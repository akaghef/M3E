name: Agent Instruction Lint

on:
  push:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/06_Operations/**"
      - "docs/protocols/**"
      - "agent_instructions/**"
      - ".codex/skills/**"
      - ".agents/skills/**"
      - ".claude/skills/**"
      - "scripts/hooks/**"
      - ".githooks/**"
      - "scripts/ops/**"
      - "scripts/beta/**"
      - "scripts/final/**"
      - "tools/sync_agent_instructions.mjs"
      - ".github/workflows/agent-instruction-lint.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/06_Operations/**"
      - "docs/protocols/**"
      - "agent_instructions/**"
      - ".codex/skills/**"
      - ".agents/skills/**"
      - ".claude/skills/**"
      - "scripts/hooks/**"
      - ".githooks/**"
      - "scripts/ops/**"
      - "scripts/beta/**"
      - "scripts/final/**"
      - "tools/sync_agent_instructions.mjs"
      - ".github/workflows/agent-instruction-lint.yml"

jobs:
  agent-instruction-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check persistent rule gate
        run: bash scripts/ops/check-persistent-rule-gate.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check delivery policy and skill mirrors
        run: bash scripts/ops/preflight.sh --check delivery-policy

      - name: Test delivery safety boundaries
        run: bash scripts/ops/preflight.sh --check delivery-tests

      - name: Test channel boundaries
        run: bash scripts/ops/preflight.sh --check channel-tests

      - name: Test Beta launcher
        run: bash scripts/ops/preflight.sh --check beta-launch-tests

      - name: Test CI push gate
        run: bash scripts/ops/preflight.sh --check ci-gate-tests

      - name: Package launcher checks for Windows
        uses: actions/upload-artifact@v4
        with:
          name: channel-scripts
          path: scripts/
          retention-days: 1

  windows-channel-entrypoints:
    needs: agent-instruction-lint
    runs-on: windows-latest
    steps:
      # Transfer only scripts from the Linux checkout: legacy Final filenames
      # cannot be indexed by Git for Windows, even with sparse checkout.
      - uses: actions/download-artifact@v4
        with:
          name: channel-scripts
          path: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check refusal paths without starting a server
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "m3e-channel-no-write"
          $env:M3E_HOME = $scratch
          git init -b codex/channel-test
          cmd /c scripts\beta\launch.bat
          if ($LASTEXITCODE -eq 0) { throw "Task branch unexpectedly launched Beta" }
          cmd /c scripts\final\update-and-launch.bat
          if ($LASTEXITCODE -eq 0) { throw "Final update accepted missing release" }
          cmd /c scripts\final\migrate-from-beta.bat
          if ($LASTEXITCODE -ne 2) { throw "Legacy promotion did not refuse" }
          if (Test-Path $scratch) { throw "Refused launch modified app data" }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD "scripts/beta/launch-with-ai.ps1"), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw $parseErrors }
          exit 0

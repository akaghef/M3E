name: Agent Instruction Lint

on:
  push:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/06_Operations/**"
      - "docs/protocols/**"
      - "agent_instructions/**"
      - ".codex/skills/**"
      - ".agents/skills/**"
      - ".claude/skills/**"
      - "scripts/hooks/**"
      - "scripts/ops/**"
      - "scripts/beta/preview-worktree.sh"
      - "tools/sync_agent_instructions.mjs"
      - ".github/workflows/agent-instruction-lint.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/06_Operations/**"
      - "docs/protocols/**"
      - "agent_instructions/**"
      - ".codex/skills/**"
      - ".agents/skills/**"
      - ".claude/skills/**"
      - "scripts/hooks/**"
      - "scripts/ops/**"
      - "scripts/beta/preview-worktree.sh"
      - "tools/sync_agent_instructions.mjs"
      - ".github/workflows/agent-instruction-lint.yml"

jobs:
  agent-instruction-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check persistent rule gate
        run: bash scripts/ops/check-persistent-rule-gate.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check delivery policy and skill mirrors
        run: node scripts/ops/check-delivery-policy.mjs

      - name: Test delivery safety boundaries
        run: node --test scripts/ops/delivery-policy.test.mjs

<!-- edge thread drawer: network view で edge クリック時に右からスライドイン -->
<aside id="edrawer" aria-hidden="true">
  <div class="ed-bar">
    <div class="ed-pair">
      <span class="ed-a">—</span>
      <span class="ed-arr">⇄</span>
      <span class="ed-b">—</span>
      <span class="ed-cnt">0</span>
    </div>
    <button class="ed-close" onclick="closeDrawer()" title="close (esc)">✕</button>
  </div>
  <div class="ed-list" id="ed-list"></div>
</aside>

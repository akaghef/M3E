<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>フィルタ案の共通画面</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#4262ff}a:hover{color:#2f4fe0}
.c *{box-sizing:border-box}
.c svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div class="c" style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: Inter, 'Segoe UI', 'Yu Gothic UI', 'Hiragino Sans', sans-serif; font-size: 13px; color: #24242a; background-color: #f4f4f4; background-image: linear-gradient(to right, #e7e7e7 1px, transparent 1px), linear-gradient(#e7e7e7 1px, transparent 1px); background-size: 46px 46px">

<sc-for list="{{lanes}}" as="ln" hint-placeholder-count="6">
<div>
<div style="position: absolute; left: {{ln.x}}px; top: {{ln.y}}px; width: {{ln.w}}px; height: {{ln.h}}px; background: {{ln.bg}}; border: 1px solid #e3e5ea"></div>
<div style="position: absolute; left: {{ln.lx}}px; top: {{ln.ly}}px; font: 700 10px Consolas, monospace; letter-spacing: 0.14em; color: #66707d">{{ln.label}}</div>
</div>
</sc-for>

<sc-for list="{{edges}}" as="e" hint-placeholder-count="40">
<svg width="1440" height="900" aria-hidden="true" style="position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none"><path d="{{e.d}}" style="fill: none; stroke: {{e.stroke}}; stroke-width: {{e.w}}px; stroke-dasharray: {{e.dash}}; opacity: {{e.op}}"></path></svg>
</sc-for>

<sc-for list="{{nodes}}" as="n" hint-placeholder-count="25">
<div style="position: absolute; left: {{n.x}}px; top: {{n.y}}px; width: 150px; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0 8px; text-align: center; border-radius: 8px; border: {{n.border}}; background: #ffffff; opacity: {{n.op}}; box-shadow: {{n.shadow}}; font-size: 12.5px; font-weight: 600; line-height: 1.2">{{n.label}}</div>
</sc-for>

<div style="position: absolute; top: 12px; left: 14px; display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 5px; border-radius: 8px; background: rgba(255,255,255,0.96); border: 1px solid rgba(20,20,30,0.11); box-shadow: 0 10px 28px rgba(20,20,30,0.16)">
<button type="button" aria-label="Home" style="width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 7px; background: transparent; color: #24242a"><svg class="i" width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></button>
<div style="height: 32px; padding: 0 10px; display: grid; place-items: center; border-radius: 6px; background: #111111; color: #ffffff; font-size: 15px; font-weight: 800">M3E</div>
<span style="padding: 0 4px; font-size: 13px; font-weight: 700">Akaghef-System 構成</span>
<span style="padding: 0 8px; color: #6b6e78; font-size: 11px; font-weight: 600">Lane / down</span>
</div>

<div style="position: absolute; top: 12px; right: 14px; display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 5px; border-radius: 8px; background: rgba(255,255,255,0.96); border: 1px solid rgba(20,20,30,0.11); box-shadow: 0 10px 28px rgba(20,20,30,0.16)">
<button type="button" style="min-height: 32px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; font: inherit; font-size: 15px; font-weight: 650">NETWORK</button>
<span style="width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: 50%; background: #3b3b46; color: #ffffff; font-size: 11px; font-weight: 800">AK</span>
<button type="button" style="height: 32px; padding: 0 10px; border: 0; border-radius: 7px; background: #4262ff; color: #ffffff; font: inherit; font-size: 13px; font-weight: 700">Share</button>
</div>

<div style="position: absolute; top: 140px; left: 16px; width: 46px; padding: 7px; display: flex; flex-direction: column; gap: 7px; border-radius: 9px; background: rgba(255,255,255,0.96); border: 1px solid rgba(20,20,30,0.11); box-shadow: 0 10px 28px rgba(20,20,30,0.16)">
<button type="button" aria-label="Select" style="width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 7px; background: #e9ddff; color: #6d31f5"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"></path></svg></button>
<button type="button" aria-label="Pen" style="width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 7px; background: transparent; color: #24242a"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 21h8"></path><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path></svg></button>
<button type="button" aria-label="検索" style="width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 7px; background: transparent; color: #24242a"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></button>
<button type="button" aria-label="Surface Progressive Navigation" style="width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 7px; background: transparent; color: #24242a"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"></path></svg></button>
<sc-if value="{{railFilter}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-label="フィルタ Progressive Navigation" aria-pressed="{{railFilterPressed}}" onClick="{{onFilter}}" style="width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 7px; background: {{railFilterBg}}; color: {{railFilterFg}}; cursor: pointer"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18l-7 8.5V18l-4 2v-7.5z"></path></svg></button>
</sc-if>
</div>

<div style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 5px; padding: 6px; border-radius: 8px; background: rgba(255,255,255,0.96); border: 1px solid rgba(20,20,30,0.11); box-shadow: 0 10px 28px rgba(20,20,30,0.16)">
<button type="button" aria-label="Zoom out" style="width: 32px; height: 32px; border: 0; border-radius: 7px; background: transparent; font: inherit; font-size: 18px">−</button>
<span style="min-width: 58px; text-align: center; font-weight: 800">FIT</span>
<button type="button" aria-label="Zoom in" style="width: 32px; height: 32px; border: 0; border-radius: 7px; background: transparent; font: inherit; font-size: 18px">+</button>
</div>

<div role="status" aria-label="status bar" style="position: absolute; bottom: 22px; left: 76px; padding: 9px 12px; border-radius: 8px; background: rgba(20,20,28,0.86); color: #ffffff; font-size: 12px">{{status}}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"phase":{"editor":"enum","options":["current","tobe","audit"],"default":"tobe"},"domains":{"editor":null,"default":[]},"railFilter":{"editor":null,"default":false},"railFilterOn":{"editor":null,"default":false},"onFilter":{"editor":null},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const phase = this.props.phase ?? 'tobe';
const domains = this.props.domains ?? [];
const railFilterOn = !!this.props.railFilterOn;
const lanesDef = [
{ label: 'L1 AI', items: [['codex', 'Codex'], ['ha', 'Hermes Agent'], ['akos', 'Akaghef OS']] },
{ label: 'L2 CLOUD', items: [['gh', 'GitHub'], ['gd', 'Google Drive'], ['chats', 'Communication Tools']] },
{ label: 'L3 DEVICE', items: [['mac', 'Mac'], ['dell', 'Dell'], ['mini', 'Mac mini'], ['ipad', 'iPad'], ['iphone', 'iPhone']] },
{ label: 'L4 DOMAIN', items: [['dom_m3e', 'M3E'], ['sys', 'System'], ['res', 'Research'], ['fam', 'Family'], ['eng', 'Engineering'], ['biz', 'Business']] },
{ label: 'L5 APPS', items: [['obsidian', 'Obsidian'], ['chrome', 'Chrome'], ['app_m3e', 'M3E'], ['miro', 'Miro'], ['ops', 'Akaghef Ops']] },
{ label: 'L6 BACK', items: [['docker', 'Docker'], ['n8n', 'n8n'], ['cloudflare', 'Cloudflare']] }
];
const SX = 96, SY = 128, LW = 1316, LH = 113, IW = 150, IH = 40, AX = SX + 120, AW = 1180;
const pos = {};
const lanes = [];
lanesDef.forEach((ln, li) => {
const top = SY + li * LH;
lanes.push({ x: SX, y: top, w: LW, h: LH, bg: li % 2 ? '#f8f9fb' : '#ffffff', label: ln.label, lx: SX + 12, ly: top + 9 });
const n = ln.items.length;
ln.items.forEach((it, i) => { pos[it[0]] = { x: Math.round(AX + (i + 0.5) * AW / n - IW / 2), y: Math.round(top + (LH - IH) / 2 + 6), lane: li, label: it[1], id: it[0] }; });
});
const E = [];
const add = (f, t, kind, direct) => E.push({ from: f, to: t, kind: kind || 'declared', direct: !!direct });
const many = (f, ts, kind, direct) => ts.forEach((t) => add(f, t, kind, direct));
const D6 = ['dom_m3e', 'sys', 'res', 'fam', 'eng', 'biz'];
const DEV = ['mac', 'dell', 'mini', 'ipad', 'iphone'];
[['docker', 'app_m3e'], ['docker', 'ops'], ['n8n', 'ops'], ['cloudflare', 'app_m3e'], ['cloudflare', 'ops']].forEach((p) => add(p[0], p[1], 'system'));
many('obsidian', D6); many('chrome', D6); many('app_m3e', ['dom_m3e', 'sys', 'eng', 'biz']); many('miro', ['res', 'eng', 'biz']); many('ops', ['sys', 'eng', 'biz'], 'system');
many('dom_m3e', ['mac', 'dell', 'ipad']); many('sys', ['mac', 'dell', 'mini']); many('res', ['mac', 'dell', 'ipad']); many('fam', ['mac', 'dell', 'ipad', 'iphone']); many('eng', ['mac', 'dell', 'ipad', 'mini']); many('biz', ['dell', 'ipad', 'iphone']);
many('mac', ['gh', 'gd', 'chats']); many('dell', ['gh', 'gd', 'chats']); many('mini', ['gh', 'gd']); many('ipad', ['gd', 'chats']); many('iphone', ['gd', 'chats']);
many('gh', ['codex', 'ha', 'akos'], 'system'); many('gd', ['codex', 'ha', 'akos']); many('chats', ['ha', 'akos']);
many('mac', ['codex', 'ha', 'akos'], 'declared', true); many('dell', ['codex', 'ha', 'akos'], 'declared', true); many('mini', ['ha', 'akos'], 'declared', true); many('ipad', ['ha', 'akos'], 'declared', true); many('iphone', ['ha', 'akos'], 'declared', true);
add('mac', 'dell', 'system'); add('mac', 'mini'); add('dell', 'mini');
const mapped = E.length;
const B = [
[['docker', 'n8n', 'cloudflare'], ['obsidian', 'chrome', 'app_m3e', 'miro', 'ops'], false],
[['obsidian', 'chrome', 'app_m3e', 'miro', 'ops'], D6, false],
[D6, DEV, false],
[DEV, ['gh', 'gd', 'chats'], false],
[['gh', 'gd', 'chats'], ['codex', 'ha', 'akos'], false],
[DEV, ['codex', 'ha', 'akos'], true]
];
const seen = new Set(E.map((e) => e.from + '>' + e.to));
B.forEach((b) => b[0].forEach((f) => b[1].forEach((t) => { const k = f + '>' + t; if (!seen.has(k)) { seen.add(k); add(f, t, 'candidate', b[2]); } })));
const S = (a) => new Set(a);
const sets = {
m3e: S(['dom_m3e', 'obsidian', 'chrome', 'app_m3e', 'mac', 'dell', 'mini', 'ipad', 'gh', 'gd', 'chats', 'codex', 'ha', 'akos', 'docker', 'cloudflare']),
system: S(['sys', 'obsidian', 'chrome', 'app_m3e', 'ops', 'mac', 'dell', 'mini', 'gh', 'gd', 'chats', 'codex', 'ha', 'akos', 'docker', 'n8n', 'cloudflare']),
research: S(['res', 'obsidian', 'chrome', 'miro', 'mac', 'dell', 'ipad', 'gd', 'chats', 'codex', 'ha', 'akos']),
family: S(['fam', 'obsidian', 'chrome', 'mac', 'dell', 'ipad', 'iphone', 'gd', 'chats', 'ha', 'akos']),
engineering: S(['eng', 'obsidian', 'chrome', 'app_m3e', 'miro', 'ops', 'mac', 'dell', 'mini', 'ipad', 'gh', 'gd', 'chats', 'codex', 'ha', 'akos', 'docker', 'n8n', 'cloudflare']),
business: S(['biz', 'obsidian', 'chrome', 'app_m3e', 'miro', 'ops', 'dell', 'ipad', 'iphone', 'gh', 'gd', 'chats', 'codex', 'ha', 'akos', 'docker', 'n8n', 'cloudflare'])
};
const phaseOk = (e) => phase === 'current' ? e.kind === 'system' : phase === 'tobe' ? e.kind !== 'candidate' : true;
const domOk = (e) => domains.length === 0 || domains.some((d) => sets[d] && sets[d].has(e.from) && sets[d].has(e.to));
const activeNodes = new Set();
let shown = 0;
const out = E.map((e) => {
const on = phaseOk(e) && domOk(e);
if (on) { shown += 1; activeNodes.add(e.from); activeNodes.add(e.to); }
const a = pos[e.from], b = pos[e.to];
let d;
if (a.lane === b.lane) {
const x1 = a.x + IW / 2, y1 = a.y + IH, x2 = b.x + IW / 2, y2 = b.y + IH, dip = 18;
d = 'M ' + x1 + ' ' + y1 + ' C ' + x1 + ' ' + (y1 + dip) + ', ' + x2 + ' ' + (y2 + dip) + ', ' + x2 + ' ' + y2;
} else {
const x1 = a.x + IW / 2, y1 = a.y, x2 = b.x + IW / 2, y2 = b.y + IH, bend = Math.max(28, Math.abs(y2 - y1) * 0.36);
d = 'M ' + x1 + ' ' + y1 + ' C ' + x1 + ' ' + (y1 - bend) + ', ' + x2 + ' ' + (y2 + bend) + ', ' + x2 + ' ' + y2;
}
const st = e.kind === 'system' ? { stroke: '#4f3bd1', w: 2.4, op: 0.85 } : e.kind === 'candidate' ? { stroke: '#8b98a5', w: 1.1, op: 0.55 } : { stroke: '#6f7686', w: 1.5, op: 0.7 };
const dash = e.kind === 'candidate' ? '2 6' : e.direct ? '6 4' : 'none';
return { d: d, stroke: st.stroke, w: st.w, op: on ? st.op : 0.035, dash: dash, on: on };
});
const edges = out.filter((e) => !e.on).concat(out.filter((e) => e.on));
const nodes = Object.keys(pos).map((k) => {
const p = pos[k], on = activeNodes.has(k);
return { x: p.x, y: p.y, label: p.label, op: on ? 1 : 0.2, border: on ? '1.5px solid #3a3d48' : '1px solid #c9ccd6', shadow: on ? '0 2px 6px rgba(20,20,30,0.10)' : 'none' };
});
const PL = { current: 'CURRENT', tobe: 'TO-BE', audit: 'EDGE AUDIT' };
const DL = { m3e: 'M3E', system: 'System', research: 'Research', family: 'Family', engineering: 'Engineering', business: 'Business' };
const dl = domains.length === 0 ? 'Domain すべて' : domains.map((x) => DL[x]).join('・');
return {
lanes: lanes, edges: edges, nodes: nodes,
railFilter: !!this.props.railFilter,
railFilterPressed: railFilterOn ? 'true' : 'false',
railFilterBg: railFilterOn ? '#111827' : 'transparent',
railFilterFg: railFilterOn ? '#ffffff' : '#24242a',
onFilter: this.props.onFilter || (() => {}),
status: PL[phase] + ' · ' + dl + ' — 項目 ' + activeNodes.size + '/25 · GraphLink ' + shown + '/' + E.length + '（図に書いた関係 ' + mapped + '）'
};
}
}
</script>
</body>
</html>
